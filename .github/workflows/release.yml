name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable action
        with:
          toolchain: stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: install frontend dependencies
        run: npm ci

      - name: validate release inputs
        run: |
          chmod 755 src-tauri/globalprotect-helper
          chmod 440 src-tauri/globalprotect-sudoers
          test -x src-tauri/globalprotect-helper
          test "$(stat -c '%a' src-tauri/globalprotect-helper)" = "755"
          test "$(stat -c '%a' src-tauri/globalprotect-sudoers)" = "440"
          sh -n src-tauri/globalprotect-helper
          cargo fmt --all -- --check
          npm audit --audit-level=high
          npm run build

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "GlobalProtect v__VERSION__"
          releaseBody: "See the changelog for this release."
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage
